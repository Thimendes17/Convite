<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Convite de Aniversário — Safari 1 Aninho</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Quicksand:wght@400;500;600;700&display=swap');

  :root{
    --forest-deep:   #16301F;
    --forest-mid:    #2E5233;
    --leaf:          #6E8F4E;
    --khaki:         #D9C9A3;
    --cream:         #F6EFDC;
    --terracotta:    #C1652F;
    --brown:         #4A3423;
    --gold:          #D9A441;
    --radius-lg: 28px;
    --radius-md: 16px;
    --shadow: 0 20px 45px rgba(15,30,18,.35);
  }

  *{ box-sizing:border-box; }
  html,body{ margin:0; padding:0; }
  body{
    font-family:'Quicksand', sans-serif;
    background:var(--forest-deep);
    color:var(--cream);
    min-height:100vh;
    overflow-x:hidden;
  }

  h1,h2,h3,.display{
    font-family:'Fredoka', sans-serif;
    margin:0;
  }

  button{ font-family:inherit; cursor:pointer; }

  .paw{ display:inline-block; width:1em; height:1em; }
  .paw svg{ width:100%; height:100%; display:block; fill:currentColor; }

  .decor{
    position:absolute;
    inset:0;
    pointer-events:none;
    z-index:0;
    overflow:hidden;
  }
  .decor-item{
    position:absolute;
    filter: drop-shadow(0 6px 10px rgba(0,0,0,.25));
  }
  .decor-item svg{ width:100%; height:auto; display:block; }
  .decor-item.scatter{ opacity:.09; filter:none; }

  @media (max-width:600px){
    .decor-item.scatter{ display:none; }
  }

  .screen{
    width:100%;
    min-height:100vh;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    padding: clamp(20px, 5vw, 60px);
    position:relative;
    opacity:1;
    transform:translateX(0);
    transition: opacity .55s ease, transform .55s ease;
    overflow:hidden;
  }
  .screen.is-hidden{
    position:absolute;
    inset:0;
    opacity:0;
    pointer-events:none;
    transform:translateX(24px);
  }

  #tela-convite{
    background:
      radial-gradient(circle at 15% 10%, rgba(217,164,65,.18), transparent 40%),
      radial-gradient(circle at 85% 90%, rgba(110,143,78,.25), transparent 45%),
      linear-gradient(160deg, var(--forest-deep) 0%, var(--forest-mid) 65%, #234327 100%);
  }

  .leaf-border{
    width:100%;
    max-width:640px;
    color:var(--leaf);
    opacity:.85;
    position:relative;
    z-index:1;
  }
  .leaf-border.top{ margin-bottom:-6px; }
  .leaf-border.bottom{ margin-top:-6px; transform:scaleY(-1); }
  .leaf-border svg{ width:100%; height:auto; display:block; }

  .convite-card{
    width:100%;
    max-width:640px;
    background:rgba(22,48,31,.6);
    backdrop-filter:blur(6px);
    border:1px solid rgba(217,201,163,.25);
    border-radius:var(--radius-lg);
    box-shadow:var(--shadow);
    padding:clamp(28px, 5vw, 56px);
    text-align:center;
    position:relative;
    z-index:1;
  }

  .kicker{
    font-family:'Fredoka', sans-serif;
    font-size:.8rem;
    letter-spacing:.28em;
    text-transform:uppercase;
    color:var(--gold);
    margin-bottom:14px;
  }

  .numero-idade{
    display:flex;
    align-items:center;
    justify-content:center;
    gap:14px;
    margin-bottom:6px;
  }
  .numero-idade .num{
    font-size:clamp(4.5rem, 16vw, 7rem);
    font-weight:700;
    line-height:1;
    color:var(--terracotta);
    text-shadow: 3px 3px 0 var(--brown);
  }
  .numero-idade .ano-txt{
    font-size:clamp(1.4rem, 4vw, 2rem);
    font-weight:600;
    color:var(--khaki);
    text-align:left;
  }
  .numero-idade .ano-txt span{ display:block; }

  .nome-bebe{
    font-size:clamp(1.6rem, 5vw, 2.4rem);
    font-weight:600;
    color:var(--cream);
    margin: 6px 0 22px;
    border-bottom:2px dashed rgba(217,201,163,.4);
    padding-bottom:10px;
    display:inline-block;
    min-width:60%;
  }

  .mensagem-convite{
    font-size:clamp(1rem, 2.6vw, 1.15rem);
    line-height:1.7;
    color:var(--cream);
    max-width:520px;
    margin:0 auto 28px;
  }

  .detalhes{
    display:flex;
    flex-wrap:wrap;
    justify-content:center;
    gap:12px 28px;
    margin-bottom:32px;
    font-size:.95rem;
    color:var(--khaki);
  }
  .detalhes .item{ display:flex; align-items:center; gap:8px; }
  .detalhes .icone{ color:var(--gold); font-size:1.1rem; }

  .btn-jornada{
    background:var(--terracotta);
    color:var(--cream);
    border:none;
    padding:16px 34px;
    border-radius:999px;
    font-family:'Fredoka', sans-serif;
    font-size:1.05rem;
    font-weight:600;
    letter-spacing:.02em;
    box-shadow:0 10px 24px rgba(193,101,47,.45);
    display:inline-flex;
    align-items:center;
    gap:10px;
    transition: transform .2s ease, box-shadow .2s ease;
  }
  .btn-jornada:hover{ transform:translateY(-3px); box-shadow:0 14px 30px rgba(193,101,47,.55); }
  .btn-jornada:active{ transform:translateY(0); }
  .btn-jornada .paw{ width:1.15em; height:1.15em; }

  .dica{ margin-top:16px; font-size:.78rem; color:rgba(246,239,220,.5); }

  #tela-galeria{
    background:
      radial-gradient(circle at 90% 10%, rgba(217,164,65,.15), transparent 40%),
      linear-gradient(200deg, #1C3B25 0%, var(--forest-deep) 70%);
  }

  .voltar{
    position:absolute;
    top: clamp(16px,4vw,28px);
    left: clamp(16px,4vw,28px);
    background:rgba(246,239,220,.1);
    border:1px solid rgba(217,201,163,.3);
    color:var(--khaki);
    padding:9px 16px;
    border-radius:999px;
    font-size:.9rem;
    display:flex;
    align-items:center;
    gap:6px;
    z-index:2;
  }
  .voltar:hover{ background:rgba(246,239,220,.18); }

  .galeria-conteudo{
    position:relative;
    z-index:1;
    display:flex;
    flex-direction:column;
    align-items:center;
    width:100%;
  }

  .galeria-titulo{ text-align:center; margin-bottom: clamp(20px, 4vw, 34px); }
  .galeria-titulo .kicker{ margin-bottom:8px; }
  .galeria-titulo h2{ font-size:clamp(1.5rem, 4.5vw, 2.2rem); color:var(--cream); }

  .slideshow{
    width:100%;
    max-width:560px;
    display:flex;
    align-items:center;
    gap:clamp(6px,2vw,20px);
  }

  .nav-paw{
    flex:0 0 auto;
    width:48px; height:48px;
    border-radius:50%;
    background:rgba(246,239,220,.1);
    border:1px solid rgba(217,201,163,.3);
    color:var(--gold);
    display:flex;
    align-items:center;
    justify-content:center;
    transition: background .2s ease, transform .2s ease;
  }
  .nav-paw:hover{ background:rgba(246,239,220,.2); transform:scale(1.06); }
  .nav-paw:disabled{ opacity:.3; pointer-events:none; }
  .nav-paw svg{ width:20px; height:20px; }

  .frame-viewport{
    flex:1 1 auto;
    aspect-ratio: 4/5;
    max-height:62vh;
    border-radius:var(--radius-lg);
    overflow:hidden;
    position:relative;
    box-shadow:var(--shadow);
    border:4px solid var(--khaki);
  }
  .frame-track{ display:flex; height:100%; transition: transform .5s cubic-bezier(.65,0,.35,1); }
  .slide-frame{
    flex:0 0 100%;
    height:100%;
    position:relative;
    background:linear-gradient(160deg,#2E5233,#16301F);
    display:flex;
    align-items:center;
    justify-content:center;
  }
  .slide-frame .placeholder-txt{ text-align:center; color:rgba(246,239,220,.55); padding:0 20px; font-size:.9rem; }
  .slide-frame .placeholder-txt .paw{ width:2.2rem; height:2.2rem; display:block; margin:0 auto 10px; color:var(--gold); opacity:.7; }
  .slide-frame img{ width:100%; height:100%; object-fit:cover; display:none; }
  .slide-frame.has-photo img{ display:block; }
  .slide-frame.has-photo .placeholder-txt{ display:none; }

  .idade-label{
    position:absolute;
    bottom:0; left:0; right:0;
    padding:12px 14px;
    background:linear-gradient(to top, rgba(0,0,0,.6), transparent);
    font-family:'Fredoka', sans-serif;
    font-weight:600;
    font-size:1.05rem;
    color:var(--cream);
    text-align:center;
  }

  .trilha{
    display:flex;
    justify-content:center;
    align-items:flex-end;
    gap:10px;
    margin-top:clamp(20px,4vw,30px);
    flex-wrap:wrap;
    max-width:520px;
  }
  .pegada-dot{
    width:22px; height:22px;
    color:rgba(217,201,163,.35);
    transition: color .25s ease, transform .25s ease;
    border:none; background:none; padding:0;
  }
  .pegada-dot:nth-child(even){ transform:translateY(6px); }
  .pegada-dot.ativa{ color:var(--gold); transform:scale(1.25) translateY(0); }
  .pegada-dot:hover{ color:var(--terracotta); }

  .creditos{ margin-top:22px; font-size:.75rem; color:rgba(246,239,220,.4); text-align:center; position:relative; z-index:1; }

  @media (max-width: 480px){
    .detalhes{ flex-direction:column; gap:8px; align-items:center; }
    .frame-viewport{ max-height:52vh; }
    .nav-paw{ width:40px; height:40px; }
  }

  @media (prefers-reduced-motion: reduce){
    .screen, .frame-track, .btn-jornada, .nav-paw{ transition:none !important; }
  }
</style>
</head>
<body>

<section class="screen" id="tela-convite">

  <div class="decor" aria-hidden="true">
    <span class="decor-item grande" style="top:-38px; left:-36px; width:clamp(90px,20vw,170px); transform:rotate(-6deg);">
      <svg viewBox="0 0 100 120"><use href="#ico-palmeira"/></svg>
    </span>
    <span class="decor-item grande" style="top:-18px; right:-14px; width:clamp(80px,17vw,140px); transform:scaleX(-1) rotate(4deg);">
      <svg viewBox="0 0 100 140"><use href="#ico-girafa"/></svg>
    </span>
    <span class="decor-item grande" style="bottom:-14px; left:-10px; width:clamp(70px,15vw,120px);">
      <svg viewBox="0 0 100 100"><use href="#ico-leao"/></svg>
    </span>
    <span class="decor-item grande" style="bottom:-30px; right:-34px; width:clamp(90px,19vw,160px);">
      <svg viewBox="0 0 100 100"><use href="#ico-elefante"/></svg>
    </span>
    <span class="decor-item grande" style="top:6px; left:50%; width:clamp(50px,10vw,74px); transform:translateX(-50%);">
      <svg viewBox="0 0 100 100"><use href="#ico-macaco"/></svg>
    </span>
    <span class="decor-item scatter" style="top:18%; left:6%; width:90px;"><svg viewBox="0 0 100 120"><use href="#ico-arvore"/></svg></span>
    <span class="decor-item scatter" style="bottom:16%; right:8%; width:110px;"><svg viewBox="0 0 100 120"><use href="#ico-arvore"/></svg></span>
    <span class="decor-item scatter" style="top:42%; right:16%; width:70px;"><svg viewBox="0 0 100 120"><use href="#ico-palmeira"/></svg></span>
  </div>

  <div class="leaf-border top">
    <svg viewBox="0 0 600 40" preserveAspectRatio="none">
      <path fill="currentColor" d="M0,40 C40,10 60,30 100,15 C140,0 160,25 200,12 C240,0 260,28 300,14
        C340,0 360,26 400,13 C440,0 460,28 500,15 C540,2 560,22 600,10 L600,40 Z"/>
    </svg>
  </div>

  <div class="convite-card">
    <p class="kicker">Você está convidado(a) para a selva</p>

    <div class="numero-idade">
      <span class="num">1</span>
      <span class="ano-txt"><span>ANO</span><span>DE VIDA</span></span>

      <span class="item"><span class="icone">📅</span><span id="txtData"></span></span>

      <span class="paw"><svg><use href="#paw-shape"/></svg></span>

        C340,0 360,26 400,13 C440,0 460,28 500,15 C540,2 560,22 600,10 L600,40 Z"/>
    </svg>

<section class="screen is-hidden" id="tela-galeria">

  <div class="decor" aria-hidden="true">
    <span class="decor-item grande" style="top:-24px; left:-20px; width:clamp(70px,14vw,110px);">
      <svg viewBox="0 0 100 120"><use href="#ico-arvore"/></svg>
    </span>
    <span class="decor-item grande" style="bottom:-26px; right:-24px; width:clamp(80px,16vw,130px);">
      <svg viewBox="0 0 100 120"><use href="#ico-palmeira"/></svg>
    </span>
    <span class="decor-item grande" style="top:-10px; right:2%; width:clamp(48px,9vw,64px);">
      <svg viewBox="0 0 100 100"><use href="#ico-macaco"/></svg>
    </span>
    <span class="decor-item scatter" style="bottom:10%; left:4%; width:80px;"><svg viewBox="0 0 100 100"><use href="#ico-leao"/></svg></span>
  </div>

  <button class="voltar" id="btnVoltar">
    <span>←</span> Voltar ao convite
  </button>

  <div class="galeria-conteudo">
    <div class="galeria-titulo">
      <p class="kicker">Do ninho para a savana</p>
      <h2>De recém-nascido a 1 aninho</h2>
    </div>

    <div class="slideshow">
      <button class="nav-paw" id="btnPrev" aria-label="Foto anterior">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg>
      </button>

      <div class="frame-viewport">
        <div class="frame-track" id="frameTrack"></div>
      </div>

      <button class="nav-paw" id="btnNext" aria-label="Próxima foto">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"/></svg>
      </button>
    </div>

    <div class="trilha" id="trilha"></div>
  </div>

  <p class="creditos">Feito com carinho para celebrar o primeiro aninho 🐾</p>

<script>
const CONFIG = {
  nomeCrianca: "Marcus Gabriel",
  mensagem: "Convite para celebrar-mos juntos meu primeiro aninho nessa aventura na selva.",
  data: "29/08/2026",
  horario: "17Hrs",
  local: "Condominio Vila Alencar. Rua Coronel Olegario Memória, 1362, Sapiranga - Fortaleza ",

  fotos: [
    { idade: "Recém-nascido", src: "rn.jpg" },
    { idade: "1 mês",         src: "1.jpg" },
    { idade: "3 meses",       src: "3.jpg" },
    { idade: "5 meses",       src: "5.jpg" },
    { idade: "7 meses",       src: "7.jpg" },
    { idade: "9 meses",       src: "9.jpg" },
    { idade: "11 meses",      src: "11.jpg" },
    { idade: "1 aninho! 🎉",  src: "" }
  ]
};
/* ============ NÃO É NECESSÁRIO EDITAR DAQUI PARA BAIXO ============ */

(function(){
  document.getElementById('txtNome').textContent = CONFIG.nomeCrianca;
  document.getElementById('txtMensagem').textContent = CONFIG.mensagem;
  document.getElementById('txtData').textContent = CONFIG.data;
  document.getElementById('txtHorario').textContent = CONFIG.horario;
  document.getElementById('txtLocal').textContent = CONFIG.local;

  const track = document.getElementById('frameTrack');
  const trilha = document.getElementById('trilha');

  CONFIG.fotos.forEach((foto, i) => {
    const slide = document.createElement('div');
    slide.className = 'slide-frame' + (foto.src ? ' has-photo' : '');

    slide.innerHTML = `
      <img src="${foto.src || ''}" alt="Foto de ${foto.idade}">
      <span class="placeholder-txt">
        <span class="paw"><svg viewBox="0 0 100 100"><use href="#paw-shape"/></svg></span>
        Foto em breve
      </span>
      <span class="idade-label">${foto.idade}</span>
    `;
    track.appendChild(slide);

    const dot = document.createElement('button');
    dot.className = 'pegada-dot';
    dot.innerHTML = `<svg viewBox="0 0 100 100"><use href="#paw-shape" fill="currentColor"/></svg>`;
    dot.setAttribute('aria-label', 'Ir para ' + foto.idade);
    dot.addEventListener('click', () => irPara(i));
    trilha.appendChild(dot);
  });

  const slides = document.querySelectorAll('.slide-frame');
  const dots = document.querySelectorAll('.pegada-dot');
  const btnPrev = document.getElementById('btnPrev');
  const btnNext = document.getElementById('btnNext');
  let atual = 0;

  function atualizar(){
    track.style.transform = `translateX(-${atual * 100}%)`;
    dots.forEach((d,i) => d.classList.toggle('ativa', i === atual));
    btnPrev.disabled = atual === 0;
    btnNext.disabled = atual === slides.length - 1;
  }

  function irPara(i){
    atual = Math.max(0, Math.min(slides.length - 1, i));
    atualizar();
  }

  btnPrev.addEventListener('click', () => irPara(atual - 1));
  btnNext.addEventListener('click', () => irPara(atual + 1));
  atualizar();

  const telaConvite = document.getElementById('tela-convite');
  const telaGaleria = document.getElementById('tela-galeria');

  document.getElementById('btnJornada').addEventListener('click', () => {
    telaConvite.classList.add('is-hidden');
    telaGaleria.classList.remove('is-hidden');
    window.scrollTo({top:0, behavior:'smooth'});
  });

  document.getElementById('btnVoltar').addEventListener('click', () => {
    telaGaleria.classList.add('is-hidden');
    telaConvite.classList.remove('is-hidden');
    window.scrollTo({top:0, behavior:'smooth'});
  });

  document.addEventListener('keydown', (e) => {
    if(telaGaleria.classList.contains('is-hidden')) return;
    if(e.key === 'ArrowRight') irPara(atual + 1);
    if(e.key === 'ArrowLeft') irPara(atual - 1);
  });
})();
</script>

</body>
</html>
